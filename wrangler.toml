name = "osu-daily-tracker-oauth"
main = "server/worker.js"
compatibility_date = "2026-10-28"
keep_vars = true

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "89a74d5d7e684075b84796503d1827c6"

[[durable_objects.bindings]]
name = "CHAT_ROOMS"
class_name = "ChatRoom"

[[durable_objects.bindings]]
name = "COOP_BOT"
class_name = "CoopBot"

[[migrations]]
tag = "v1_chat_rooms"
new_sqlite_classes = ["ChatRoom"]

[[migrations]]
tag = "v2_coop_bot"
new_sqlite_classes = ["CoopBot"]
