<!doctype html>
<html lang="ru">
<head>
<script src="./security.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17"><link rel="icon" type="image/svg+xml" href="./icon.svg"><title>Управление ботом · osu! Daily Tracker 4.17.6</title>
<style>
:root{color-scheme:dark;--bg:#0b0f17;--panel:#141b28;--line:#2d4054;--ice:#a9e7ff;--cyan:#57c9e8;--text:#fff7fc;--muted:#91a3b9;--good:#8ee4b5;--danger:#ff9baf}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% -10%,#20364b 0,transparent 36%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif;padding:16px}
.wrap{max-width:900px;margin:auto}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}h1{font-size:22px;margin:0}.grow{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
button,.button{border:1px solid var(--line);background:#1b293b;color:var(--text);border-radius:9px;padding:8px 11px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button.primary{border-color:var(--cyan);background:var(--cyan);color:#08121c;font-weight:700}button.danger{border-color:var(--danger);color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--text);font:inherit;min-width:0}
.status{margin-top:10px;min-height:20px;color:var(--muted)}.status.error{color:var(--danger)}.status.success{color:var(--good)}
.room{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;background:#101722}.room .meta{color:var(--muted);font-size:13px}.room .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
</style>
</head>
<body><div class="wrap">
<div class="top"><h1>🤖 Управление ботом</h1><span class="grow"></span><a class="button" href="./chat.html">← Чат</a></div>
<div class="panel"><div class="row"><span id="botStatus">Проверяем состояние…</span><span class="grow"></span><button id="refreshButton" class="primary" type="button">Обновить</button><button id="disconnectBotButton" class="danger" type="button">Отключить бота</button></div><div id="status" class="status"></div></div>
<div class="panel"><h3>Принудительное управление</h3><div class="row"><input id="forceRoomId" type="number" min="1" placeholder="ID комнаты" style="flex:1;min-width:140px"><button id="forceStart" class="primary" type="button">Начать игру</button><button id="forceClose" class="danger" type="button">Закрыть комнату</button></div></div>
<div class="panel"><h3>Активные комнаты</h3><div id="rooms"><div class="status">Загрузка…</div></div></div>
</div>
<script>
const API_BASE='https://osu-daily-tracker-oauth.anton4ik837.workers.dev';
const SESSION_KEY='osu-daily-tracker-google-session';
const $=id=>document.getElementById(id);
const session=()=>{try{return localStorage.getItem(SESSION_KEY)||''}catch{return''}};
async function api(path,options={}){
 const response=await fetch(API_BASE+path,{...options,headers:{...(options.headers||{}),Accept:'application/json',Authorization:'Bearer '+session()}});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(data.details?(String(data.error||'Ошибка')+': '+data.details):String(data.error||'HTTP '+response.status));
 return data;
}
function setStatus(text,kind=''){$('status').textContent=text;$('status').className='status'+(kind?' '+kind:'')}
async function load(){
 try{
  const bot=await api('/api/coop/bot-session');
  $('botStatus').textContent=bot.configured?('Бот подключён'+(bot.username?' · '+bot.username:'')):'Бот не подключён';
  const data=await api('/api/coop/rooms');
  const rooms=data.rooms||[];
  const host=$('rooms');host.replaceChildren();
  if(!rooms.length){host.innerHTML='<div class="status">Комнат пока нет.</div>';return}
  for(const room of rooms){
   const card=document.createElement('div');card.className='room';
   const name=document.createElement('div');name.textContent=room.name||('Комната '+room.id);
   const meta=document.createElement('div');meta.className='meta';meta.textContent='ID '+room.id+' · '+(room.rulesetId===3?'mania':'standard')+' · карта '+(room.beatmapId||'—')+(room.password?' · пароль есть':'');
   const actions=document.createElement('div');actions.className='actions';
   const open=document.createElement('button');open.type='button';open.textContent='Открыть в osu!';open.onclick=()=>{const url='osu://room/'+room.id;if(window.DesktopBridge?.openExternal)window.DesktopBridge.openExternal(url).catch(()=>{});else if(window.NativeOpener?.open)window.NativeOpener.open({url}).catch(()=>{});else location.href=url};
   const start=document.createElement('button');start.type='button';start.className='primary';start.textContent='Начать игру';start.onclick=async()=>{try{await api('/api/coop/rooms/'+room.id+'/start',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});setStatus('Матч запущен.','success')}catch(e){setStatus(e.message,'error')}};
   const close=document.createElement('button');close.type='button';close.className='danger';close.textContent='Закрыть';close.onclick=async()=>{try{const closed=await api('/api/coop/rooms/'+room.id+'/close',{method:'POST'});setStatus(closed.note||'Комната закрыта.','success');load()}catch(e){setStatus(e.message,'error')}};
   actions.append(open,start,close);card.append(name,meta,actions);host.append(card);
  }
 }catch(e){setStatus(e.message,'error')}
}
$('refreshButton').onclick=load;
$('disconnectBotButton').onclick=async()=>{try{await api('/api/coop/bot-session/disconnect',{method:'POST'});setStatus('Бот отключён.','success');load()}catch(e){setStatus(e.message,'error')}};
$('forceStart').onclick=async()=>{const id=Number($('forceRoomId').value)||0;if(!id){setStatus('Укажи ID комнаты.','error');return}try{await api('/api/coop/rooms/'+id+'/start',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});setStatus('Матч запущен.','success')}catch(e){setStatus(e.message,'error')}};
$('forceClose').onclick=async()=>{const id=Number($('forceRoomId').value)||0;if(!id){setStatus('Укажи ID комнаты.','error');return}try{const closed=await api('/api/coop/rooms/'+id+'/close',{method:'POST'});setStatus(closed.note||'Комната закрыта.','success');load()}catch(e){setStatus(e.message,'error')}};
load();
</script>
</body></html>
