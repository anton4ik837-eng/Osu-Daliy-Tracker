<!doctype html>
<html lang="ru">
<head>
<script src="./security.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17"><link rel="icon" type="image/svg+xml" href="./icon.svg"><title>Чат · osu! Daily Tracker 4.17.17</title>
<style>
:root{color-scheme:dark;--bg:#0b0f17;--bg-glow:#20364b;--surface:#141b28;--surface2:#1b293b;--card-bg:#101722;--panel-start:#182536;--panel-end:#141b28;--line:#2d4054;--border-strong:#38536b;--pink:#57c9e8;--pink2:#a9e7ff;--text:#fff7fc;--muted:#91a3b9;--good:#8ee4b5;--danger:#ff9baf;--field:#0b0f17;--theme-image:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% -10%,var(--bg-glow) 0,transparent 36%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}
body.has-theme-art{background-image:linear-gradient(90deg,rgba(4,8,16,.94) 0%,rgba(4,8,16,.7) 42%,rgba(4,8,16,.18) 100%),var(--theme-image);background-size:cover,auto 115%;background-position:center,right top;background-attachment:fixed,fixed;background-repeat:no-repeat}
html{scrollbar-color:var(--line) var(--card-bg);scrollbar-width:thin}*{scrollbar-width:thin;scrollbar-color:var(--border-strong) var(--card-bg)}*::-webkit-scrollbar{width:9px;height:9px}*::-webkit-scrollbar-track{background:var(--card-bg);border-radius:9px}*::-webkit-scrollbar-thumb{background:var(--border-strong);border:2px solid var(--card-bg);border-radius:9px}*::-webkit-scrollbar-thumb:hover{background:var(--pink)}*::-webkit-scrollbar-corner{background:var(--card-bg)}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 94%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.topbar a{color:var(--pink2);text-decoration:none;font-size:13px}.topbar b{font-size:16px}.topbar .spacer{flex:1}
.wrap{max-width:1100px;margin:0 auto;padding:14px 12px 40px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px}
@media(max-width:700px){.wrap{grid-template-columns:1fr}.rooms{max-height:260px;overflow:auto}}
.panel{background:linear-gradient(155deg,var(--panel-start),var(--panel-end));border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.panel-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.panel-head h2{font-size:15px;margin:0}.panel-head .spacer{flex:1}
button,.button{border:1px solid var(--border-strong,#38536b);background:var(--surface2);color:var(--text);border-radius:9px;padding:8px 11px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button:disabled{opacity:.5;cursor:not-allowed}input,textarea{background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;width:100%}
.muted{color:var(--muted);font-size:12px}.status{min-height:18px;margin-top:8px;font-size:12px;color:var(--muted);word-break:break-word}.status[data-kind="error"]{color:var(--danger)}.status[data-kind="success"]{color:var(--good)}
.rooms{display:flex;flex-direction:column;gap:6px}.room{display:flex;gap:9px;align-items:center;padding:9px;border:1px solid transparent;border-radius:10px;background:var(--card-bg);cursor:pointer;text-align:left;color:inherit;width:100%}
.room:hover{background:var(--surface2)}.room.active{border-color:var(--pink);background:color-mix(in srgb,var(--pink) 16%,var(--card-bg))}.room .info{min-width:0;flex:1}.room .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.room .last{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--pink2);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.chat-head{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:10px}.chat-head .name{font-weight:800}
.messages{height:min(55vh,520px);overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.msg{max-width:82%;padding:8px 11px;border-radius:12px;background:var(--surface);border:1px solid var(--line);word-break:break-word;white-space:pre-wrap}
.msg.mine{align-self:flex-end;background:color-mix(in srgb,var(--pink) 20%,var(--card-bg));border-color:color-mix(in srgb,var(--pink) 45%,var(--line))}.msg .meta{font-size:11px;color:var(--pink2);margin-bottom:2px}.msg .time{font-size:10px;color:var(--muted);margin-top:3px;text-align:right}.msg a{color:var(--pink2);text-decoration:underline;font-weight:600}
.composer{display:flex;gap:8px;margin-top:10px}.composer input{flex:1}
.hint{padding:30px 10px;text-align:center;color:var(--muted)}
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--bg) 82%,transparent)}.overlay[hidden]{display:none}
.dialog{width:min(440px,100%);background:linear-gradient(155deg,var(--panel-start),var(--panel-end));border:1px solid var(--border-strong);border-radius:16px;padding:18px}
.dialog h3{margin:0 0 10px;font-size:17px}.dialog label{display:block;margin:10px 0;font-size:12px;color:var(--muted)}.dialog label span{display:block;margin-bottom:4px}.dialog .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.online{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.panel{position:relative}
.icon-btn{width:42px;flex:none;padding:8px;font-size:19px;line-height:1}
.attach-menu{position:absolute;bottom:54px;left:12px;z-index:8;background:linear-gradient(155deg,var(--panel-start),var(--panel-end));border:1px solid var(--border-strong);border-radius:12px;padding:6px;min-width:210px;box-shadow:0 12px 34px #0009;display:none}
.attach-menu.open{display:block}
.attach-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px}
.attach-menu button:hover:not(:disabled){background:var(--surface2)}
.attach-menu button:disabled{opacity:.45}
.coop-mini{border:1px solid var(--border-strong);border-radius:14px;background:linear-gradient(155deg,var(--panel-start),var(--panel-end));padding:12px;margin-bottom:10px;display:none}
.coop-mini.open{display:block}.coop-mini h3{margin:0;font-size:14px}
.coop-mini .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.coop-mini input{background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px;font:inherit;flex:1;min-width:110px}
.map-tabs{display:flex;gap:6px;margin-top:9px}.map-tabs button{flex:1;padding:6px}
.map-list{max-height:168px;overflow:auto;margin-top:8px;display:flex;flex-direction:column;gap:5px}
.map-item{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--card-bg);color:var(--text);cursor:pointer;font-size:12px;width:100%}
.map-item.selected{border-color:var(--pink);background:color-mix(in srgb,var(--pink) 16%,var(--card-bg))}
.map-item .meta{color:var(--muted);font-size:11px;margin-left:auto;text-align:right;flex:none}
</style>
</head>
<body>
<header class="topbar"><a href="./index.html">← Назад</a><b>Чат</b><span class="spacer"></span><span class="muted" id="sessionBadge">—</span></header>
<main class="wrap">
<section class="panel"><div class="panel-head"><h2>Беседы</h2><span class="spacer"></span><button id="newDmButton" type="button" title="Личный чат">+ ЛС</button><button id="newGroupButton" type="button" title="Группа">+ Группа</button></div><div id="roomList" class="rooms"><div class="hint">Загрузка…</div></div><div id="chatStatus" class="status" role="status"></div></section>
<section class="panel"><div id="chatHead" class="chat-head"><div class="avatar" id="chatAvatar">?</div><div><div class="name" id="chatName">Выбери беседу</div><div class="muted" id="chatSub">Сообщения и звонки в одном месте</div></div></div><div id="messages" class="messages"><div class="hint">Выбери беседу слева, чтобы начать переписку.</div></div><div id="coopMini" class="coop-mini"><div style="display:flex;align-items:center;gap:8px"><h3>🎮 Coop-комната</h3><span style="flex:1"></span><a class="button secondary" href="./bot.html" style="padding:3px 9px;font-size:12px">Бот ↗</a><button id="coopClose" class="secondary" type="button" style="padding:3px 9px">×</button></div><div id="coopHostStatus" class="muted" style="margin-top:5px">—</div><div id="coopHostLink" style="margin-top:6px"></div><div class="row"><input id="coopName" type="text" maxlength="80" placeholder="Название комнаты"><input id="coopSlots" type="number" min="2" max="50" value="2" style="flex:none;width:76px"></div><div class="map-tabs"><button id="mapTabStd" class="secondary" type="button">STD</button><button id="mapTabMania" type="button">MANIA</button></div><div id="mapList" class="map-list"><div class="muted">Загрузка карт…</div></div><div class="row"><button id="coopCreate" type="button">Создать комнату</button><button id="coopSendLink" class="secondary" type="button" disabled>Отправить ссылку в чат</button><button id="coopOpenOsu" class="secondary" type="button" disabled>Открыть в osu!</button><button id="coopSetMap" class="secondary" type="button" disabled>Сменить карту</button><button id="coopStart" class="secondary" type="button" disabled>Старт матча</button></div><div id="coopStatus" class="status" role="status"></div></div><div class="composer"><button id="attachButton" class="icon-btn" type="button" title="Ещё">⋯</button><input id="messageInput" type="text" maxlength="4000" placeholder="Напиши сообщение…" disabled><button id="sendButton" type="button" disabled>Отправить</button></div><div id="attachMenu" class="attach-menu"><button id="menuCoop" type="button">🎮 Создать Coop-комнату</button><button type="button" disabled>📼 Отправить реплей — скоро</button><button type="button" disabled>🖼 Отправить фото — скоро</button></div><div id="sendStatus" class="status" role="status"></div></section>
</main>
<div id="dmOverlay" class="overlay" hidden><div class="dialog"><h3>Новый личный чат</h3><p class="muted">Введи юзернейм из профиля приложения.</p><label><span>Юзернейм</span><input id="dmUsername" type="text" maxlength="24" placeholder="например, miyabi"></label><div class="actions"><button id="dmCreate" type="button">Создать чат</button><button id="dmCancel" class="secondary" type="button">Отмена</button></div><div id="dmStatus" class="status"></div></div></div>
<div id="groupOverlay" class="overlay" hidden><div class="dialog"><h3>Новая группа</h3><label><span>Название</span><input id="groupName" type="text" maxlength="60" placeholder="Моя команда"></label><label><span>Участники через запятую</span><input id="groupMembers" type="text" maxlength="400" placeholder="miyabi, rimuru"></label><div class="actions"><button id="groupCreate" type="button">Создать группу</button><button id="groupCancel" class="secondary" type="button">Отмена</button></div><div id="groupStatus" class="status"></div></div></div>
<script>
const API_BASE='https://osu-daily-tracker-oauth.anton4ik837.workers.dev';
const SESSION_KEY='osu-daily-tracker-google-session';
const $=id=>document.getElementById(id);
const THEME_KEY='osu-daily-tracker-theme-v1';
const THEME_DEFAULTS={'--bg':'#0b0f17','--bg-glow':'#20364b','--panel-start':'#182536','--panel-end':'#141b28','--surface2':'#1b293b','--card-bg':'#101722','--line':'#2d4054','--border-strong':'#38536b','--pink':'#57c9e8','--pink2':'#a9e7ff','--text':'#fff7fc','--muted':'#91a3b9','--good':'#8ee4b5','--danger':'#ff9baf','--field-bg':'#0b0f17'};
function applyChatTheme(theme){
 const root=document.documentElement;
 Object.entries(THEME_DEFAULTS).forEach(([key,fallback])=>root.style.setProperty(key,theme&&/^#[0-9a-f]{6}$/i.test(theme[key]||'')?theme[key]:fallback));
 root.style.setProperty('--surface',root.style.getPropertyValue('--panel-end').trim());
 root.style.setProperty('--field',root.style.getPropertyValue('--field-bg').trim());
 const image=String(theme?.__image||'');
 root.style.setProperty('--theme-image',/^[a-z0-9_-]+\.(svg|webp)$/i.test(image)?'url("./themes/'+image+'")':'none');
 document.body.classList.toggle('has-theme-art',!!image);
}
try{applyChatTheme(JSON.parse(localStorage.getItem(THEME_KEY)||'null'))}catch{}
const session=()=>{try{return localStorage.getItem(SESSION_KEY)||''}catch{return''}};
let rooms=[],activeRoom=null,ws=null,reconnectTimer=null,me={sub:'',name:'',avatar:''};
async function api(path,options={},token){
 const response=await fetch(API_BASE+path,{...options,headers:{...(options.headers||{}),Accept:'application/json',Authorization:'Bearer '+(token||session())}});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw new Error(data.details?(String(data.error||'Ошибка')+': '+data.details):String(data.error||'HTTP '+response.status));
 return data;
}
function avatarNode(src,name){
 const box=document.createElement('div');box.className='avatar';
 if(src){const img=document.createElement('img');img.src=src;img.alt='';box.append(img)}
 else box.textContent=(String(name||'?').trim().charAt(0)||'?').toUpperCase();
 return box;
}
function setStatus(id,text,kind='info'){const el=$(id);if(el){el.textContent=text;el.dataset.kind=kind}}
function renderRooms(){
 const host=$('roomList');host.replaceChildren();
 if(!rooms.length){const p=document.createElement('div');p.className='hint';p.textContent='Бесед пока нет. Нажми «+ ЛС» или «+ Группа».';host.append(p);return}
 for(const room of rooms){
  const button=document.createElement('button');button.type='button';button.className='room'+(activeRoom?.id===room.id?' active':'');
  button.append(avatarNode(room.avatar,room.name));
  const info=document.createElement('div');info.className='info';
  const name=document.createElement('div');name.className='name';name.textContent=room.name||'Беседа';
  const last=document.createElement('div');last.className='last';last.textContent=room.last?room.last.name+': '+room.last.body:'Начни переписку';
  info.append(name,last);button.append(info);
  if(room.kind==='group'){const tag=document.createElement('span');tag.className='muted';tag.textContent='●';tag.title='Группа';button.append(tag)}
  button.addEventListener('click',()=>openRoom(room.id));host.append(button);
 }
}
async function loadRooms(){
 if(!session()){setStatus('chatStatus','Войди через Google в основном приложении, чтобы пользоваться чатом.','error');return}
 try{
  const meData=await api('/api/google/me');
  const profile=await api('/api/profile');
  me={sub:meData.user?.sub||'',username:profile.profile?.username||'',name:profile.profile?.displayName||meData.user?.name||'',avatar:profile.profile?.avatar||meData.user?.picture||''};
  $('sessionBadge').textContent='@'+(profile.profile?.username||'...');
  const data=await api('/api/chat/rooms');rooms=data.rooms||[];renderRooms();
  setStatus('chatStatus','','info');
 }catch(error){setStatus('chatStatus','Не удалось загрузить беседы: '+error.message,'error')}
}
const cacheKey=id=>'chat-cache:'+id;
function cacheMessages(roomId,messages){
 try{localStorage.setItem(cacheKey(roomId),JSON.stringify((messages||[]).slice(-300)))}catch{}
}
function cachedMessages(roomId){
 try{const raw=localStorage.getItem(cacheKey(roomId));const list=raw?JSON.parse(raw):[];return Array.isArray(list)?list:[]}catch{return[]}
}
function appendLinkedText(host,text){
 const re=/https?:\/\/[^\s<>"']+/g;let last=0,match;
 while((match=re.exec(String(text||'')))){
  if(match.index>last)host.append(document.createTextNode(String(text).slice(last,match.index)));
  const a=document.createElement('a');a.href=match[0];a.target='_blank';a.rel='noopener noreferrer';
  a.textContent=a.href.includes('/coop?room=')?'Открыть приглашение в мультиплеер ↗':match[0];
  host.append(a);last=match.index+match[0].length;
 }
 if(last<String(text||'').length)host.append(document.createTextNode(String(text).slice(last)));
}
function renderMessages(){
 const host=$('messages');host.replaceChildren();
 if(!activeRoom){host.innerHTML='<div class="hint">Выбери беседу слева, чтобы начать переписку.</div>';return}
 const items=activeRoom.messages||[];
 if(!items.length){host.innerHTML='<div class="hint">Сообщений пока нет. Напиши первым.</div>';return}
 for(const item of items){
  const div=document.createElement('div');div.className='msg'+(item.sender===me.sub?' mine':'');
  const meta=document.createElement('div');meta.className='meta';meta.textContent=item.name||'Игрок';
  const body=document.createElement('div');appendLinkedText(body,item.body);
  const time=document.createElement('div');time.className='time';time.textContent=new Date(item.createdAt||Date.now()).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  div.append(meta,body,time);host.append(div);
 }
 host.scrollTop=host.scrollHeight;
}
async function connectSocket(){
 if(ws||!activeRoom)return;
 let auth='session='+encodeURIComponent(session());
 try{
  const ticket=await api('/api/chat/ws-ticket');
  if(ticket?.ticket)auth='ticket='+encodeURIComponent(ticket.ticket);
 }catch{}
 const url=API_BASE.replace(/^https/,'wss')+'/api/chat/ws/'+encodeURIComponent(activeRoom.id)+'?'+auth;
 try{ws=new WebSocket(url)}catch(error){setStatus('sendStatus','Не удалось подключиться: '+error.message,'error');return}
 ws.onopen=()=>{setStatus('sendStatus','Подключено.','success');$('messageInput').disabled=false;$('sendButton').disabled=false};
 ws.onmessage=event=>{
  let data;try{data=JSON.parse(event.data)}catch{return}
  if(data.type==='message'&&activeRoom){
   activeRoom.messages=activeRoom.messages||[];
   if(!activeRoom.messages.some(item=>item.id===data.id))activeRoom.messages.push(data);
   cacheMessages(activeRoom.id,activeRoom.messages);
   renderMessages();
  }
  if(data.type==='error')setStatus('chatStatus',data.message,'error');
 };
 ws.onclose=()=>{ws=null;$('messageInput').disabled=true;$('sendButton').disabled=true;if(activeRoom){clearTimeout(reconnectTimer);reconnectTimer=setTimeout(connectSocket,3000)}};
 ws.onerror=()=>setStatus('sendStatus','Ошибка соединения, пробуем снова…','error');
}
async function openRoom(roomId){
 const room=rooms.find(item=>item.id===roomId);if(!room)return;
 clearTimeout(reconnectTimer);if(ws){ws.onclose=null;ws.close();ws=null}
 activeRoom={...room,messages:cachedMessages(roomId)};
 $('chatName').textContent=room.name||'Беседа';
 $('chatSub').textContent=room.kind==='group'?'Группа':'Личный чат';
 const avatar=avatarNode(room.avatar,room.name);avatar.id='chatAvatar';$('chatAvatar').replaceWith(avatar);
 renderMessages();renderRooms();connectSocket();
 try{
  const data=await api('/api/chat/rooms/'+encodeURIComponent(roomId)+'/messages?limit=300');
  const merged=new Map();
  for(const item of activeRoom.messages||[])if(item?.id)merged.set(item.id,item);
  for(const item of data.messages||[])if(item?.id)merged.set(item.id,item);
  activeRoom.messages=[...merged.values()].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  cacheMessages(roomId,activeRoom.messages);
  renderMessages();
 }catch(error){setStatus('chatStatus','История недоступна: '+error.message,'error');setStatus('sendStatus','История недоступна: '+error.message,'error')}
}
function sendMessage(){
 const input=$('messageInput'),body=input.value.trim();
 if(!body||!ws||ws.readyState!==WebSocket.OPEN)return;
 ws.send(JSON.stringify({type:'message',body}));input.value='';
}
$('sendButton').addEventListener('click',sendMessage);
$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendMessage()}});
$('newDmButton').addEventListener('click',()=>{$('dmOverlay').hidden=false;$('dmUsername').focus()});
$('dmCancel').addEventListener('click',()=>$('dmOverlay').hidden=true);
$('newGroupButton').addEventListener('click',()=>{$('groupOverlay').hidden=false;$('groupName').focus()});
$('groupCancel').addEventListener('click',()=>$('groupOverlay').hidden=true);
$('dmCreate').addEventListener('click',async()=>{
 const button=$('dmCreate');button.disabled=true;setStatus('dmStatus','Создаём чат…');
 try{const data=await api('/api/chat/dm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('dmUsername').value.trim()})});$('dmOverlay').hidden=true;await loadRooms();await openRoom(data.roomId)}
 catch(error){setStatus('dmStatus',error.message,'error')}
 finally{button.disabled=false}
});
$('groupCreate').addEventListener('click',async()=>{
 const button=$('groupCreate');button.disabled=true;setStatus('groupStatus','Создаём группу…');
 try{
  const members=$('groupMembers').value.split(',').map(x=>x.trim()).filter(Boolean);
  const data=await api('/api/chat/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('groupName').value.trim(),members})});
  $('groupOverlay').hidden=true;await loadRooms();await openRoom(data.roomId);
 }catch(error){setStatus('groupStatus',error.message,'error')}
 finally{button.disabled=false}
});
const OSU_KEY='osu-daily-tracker-oauth-session';
const coopState={mode:'mania',mapId:0,room:null};
async function readOsuSession(){
 if(window.DesktopBridge?.secureGet){try{const s=await window.DesktopBridge.secureGet('oauth-session');if(s?.accessToken)return s}catch{}}
 try{return JSON.parse(localStorage.getItem(OSU_KEY)||'null')}catch{return null}
}
async function writeOsuSession(session){
 if(window.DesktopBridge?.secureSet){try{await window.DesktopBridge.secureSet('oauth-session',session);return}catch{}}
 try{localStorage.setItem(OSU_KEY,JSON.stringify(session))}catch{}
}
async function registerBotFromLocal(){
 const s=await readOsuSession();
 if(!s?.accessToken||!s?.refreshToken)return false;
 try{
  await api('/api/coop/bot-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessToken:s.accessToken,refreshToken:s.refreshToken,expiresIn:Math.max(0,Math.floor(((s.expiresAt||Date.now())-Date.now())/1000))})});
  return true;
 }catch{return false}
}
async function renderCoopHost(){
 const host=$('coopHostStatus'),link=$('coopHostLink');
 try{
  let status=await api('/api/coop/bot-session');
  if(!status.configured&&await registerBotFromLocal())status=await api('/api/coop/bot-session');
  if(status.configured){host.textContent='Комнаты создаются ботом '+(status.username||'TrackingBot')+'.';link.replaceChildren();return}
 }catch{}
 host.textContent='Бот ещё не подключён.';
 link.replaceChildren();
 const button=document.createElement('button');button.className='button secondary';button.type='button';button.textContent='Зарегистрировать текущий osu!-логин';button.addEventListener('click',async()=>{
  if(await registerBotFromLocal())renderCoopHost();
  else setStatus('coopStatus','Не удалось зарегистрировать. Сначала войди под ботом через главную страницу.','error');
 });
 const a=document.createElement('a');a.className='button secondary';a.href='./index.html?rooms=1';a.textContent='Подключить бота один раз ↗';link.append(button,a);
}
async function loadPopularMaps(mode){
 const list=$('mapList');list.replaceChildren();
 list.innerHTML='<div class="muted">Загрузка карт…</div>';
 try{
  const data=await api('/api/coop/popular-beatmaps?mode='+mode);
  list.replaceChildren();
  const maps=data.maps||[];
  if(!maps.length){list.innerHTML='<div class="muted">Карты не найдены.</div>';return}
  for(const map of maps){
   const item=document.createElement('button');item.type='button';item.className='map-item'+(coopState.mapId===map.id?' selected':'');
   const label=document.createElement('span');label.textContent=(map.artist?map.artist+' — ':'')+map.title+(map.version?' ['+map.version+']':'');
   const meta=document.createElement('span');meta.className='meta';meta.textContent=(map.stars?Number(map.stars).toFixed(2)+'★ · ':'')+(map.plays?Number(map.plays).toLocaleString('ru-RU')+' игр':'');
   item.append(label,meta);
   item.addEventListener('click',()=>{coopState.mapId=map.id;list.querySelectorAll('.map-item').forEach(x=>x.classList.remove('selected'));item.classList.add('selected');setStatus('coopStatus','Выбрана карта: '+label.textContent,'success')});
   list.append(item);
  }
 }catch(error){list.replaceChildren();setStatus('coopStatus','Карты не загрузились: '+error.message,'error')}
}
async function coopAccessToken(){
 let s=await readOsuSession();
 if(!s?.accessToken)throw new Error('Подключи osu! с правами хоста');
 if(s.expiresAt&&s.expiresAt>Date.now()+30000)return s.accessToken;
 const response=await fetch(API_BASE+'/oauth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refreshToken})});
 const tokens=await response.json();
 if(!response.ok||!tokens.access_token)throw new Error(tokens.error||'Не удалось обновить osu!-сессию');
 const next={...s,accessToken:tokens.access_token,refreshToken:tokens.refresh_token||s.refreshToken,expiresAt:Date.now()+Number(tokens.expires_in||0)*1000};
 await writeOsuSession(next);return next.accessToken;
}
function coopShareLink(id){return API_BASE+'/coop?room='+encodeURIComponent(id)}
const withTimeout=(promise,ms=3500)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(Error('timeout')),ms))]);
async function openCoopInOsu(id){
 const url='osu://room/'+encodeURIComponent(id);
 const invite=coopShareLink(id);
 setStatus('coopStatus','Открываем osu!…');
 // A real link click is handled by Android the same way as on the invite page.
 try{
  const link=document.createElement('a');link.href=url;link.style.display='none';document.body.append(link);link.click();link.remove();
  await new Promise(resolve=>setTimeout(resolve,900));
  if(document.hidden){setStatus('coopStatus','osu! запущен.','success');return}
 }catch{}
 try{
  if(window.NativeOpener?.open){await withTimeout(window.NativeOpener.open({url}),2500);setStatus('coopStatus','osu! должен открыться. Если игра не запустилась — установи lazer.','success');return}
 }catch{}
 setStatus('coopStatus','Прямой переход не сработал — открываем приглашение, там нажми «Открыть в osu!».','error');
 try{
  if(window.NativeBrowser?.open)await window.NativeBrowser.open({url:invite});
  else if(window.DesktopBridge?.openExternal)await window.DesktopBridge.openExternal(invite);
  else location.href=invite;
 }catch(error){setStatus('coopStatus','Не удалось открыть приглашение: '+String(error.message||error),'error')}
}
async function copyCoopLink(text){
 try{await navigator.clipboard.writeText(text);return true}catch{}
 try{
  const input=document.createElement('textarea');input.value=text;input.style.position='fixed';input.style.opacity='0';document.body.append(input);input.select();const ok=document.execCommand('copy');input.remove();return ok;
 }catch{return false}
}
function toggleAttach(open){$('attachMenu').classList.toggle('open',!!open)}
$('attachButton').addEventListener('click',()=>toggleAttach(!$('attachMenu').classList.contains('open')));
$('menuCoop').addEventListener('click',()=>{
 toggleAttach(false);$('coopMini').classList.add('open');
 renderCoopHost();loadPopularMaps(coopState.mode);
});
$('coopClose').addEventListener('click',()=>$('coopMini').classList.remove('open'));
$('mapTabMania').addEventListener('click',()=>{coopState.mode='mania';coopState.mapId=0;$('mapTabMania').removeAttribute('class');$('mapTabStd').className='secondary';loadPopularMaps('mania')});
$('mapTabStd').addEventListener('click',()=>{coopState.mode='std';coopState.mapId=0;$('mapTabStd').removeAttribute('class');$('mapTabMania').className='secondary';loadPopularMaps('std')});
$('coopCreate').addEventListener('click',async()=>{
 const button=$('coopCreate');button.disabled=true;setStatus('coopStatus','Создаём комнату…');
 try{
  if(!coopState.mapId)throw new Error('Выбери карту из списка');
  const data=await api('/api/coop/rooms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('coopName').value.trim()||'Coop с другом',beatmapId:coopState.mapId,rulesetId:coopState.mode==='mania'?3:0,maxParticipants:Number($('coopSlots').value)||2})});
  coopState.room=data.room;
  $('coopSendLink').disabled=false;$('coopOpenOsu').disabled=false;$('coopSetMap').disabled=false;$('coopStart').disabled=false;
  setStatus('coopStatus','Комната '+data.room.id+' создана. Пароль: '+(data.room.password||'—')+'. Ссылка: '+coopShareLink(data.room.id),'success');
 }catch(error){
  const text=String(error.message||error);
  setStatus('coopStatus',text.includes('room_name_exists')?String(text).replace(/^room_name_exists:\s*/,''):'osu! отклонил запрос: '+text,'error');
 }
 finally{button.disabled=false}
});
$('coopSendLink').addEventListener('click',async()=>{
 if(!coopState.room){setStatus('coopStatus','Сначала создай комнату.','error');return}
 const text='Вас пригласили в мультиплеер! Комната '+coopState.room.id+(coopState.room.password?' · пароль: '+coopState.room.password:'')+'\n'+coopShareLink(coopState.room.id);
 if(ws&&ws.readyState===WebSocket.OPEN){
  ws.send(JSON.stringify({type:'message',body:text}));
  setStatus('coopStatus','Ссылка отправлена в чат.','success');return;
 }
 const copied=await copyCoopLink(text);
 setStatus('coopStatus',copied?'Выбери беседу слева — ссылка скопирована, вставь её в поле сообщения.':'Выбери беседу слева, чтобы отправить ссылку в чат.',copied?'success':'error');
});
$('coopOpenOsu').addEventListener('click',()=>{
 if(!coopState.room){setStatus('coopStatus','Сначала создай комнату.','error');return}
 openCoopInOsu(coopState.room.id);
});
$('coopSetMap').addEventListener('click',async()=>{
 if(!coopState.room||!coopState.mapId){setStatus('coopStatus','Выбери карту в списке.','error');return}
 try{
  const token=await coopAccessToken();
  await api('/api/coop/rooms/'+coopState.room.id+'/beatmap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({beatmapId:coopState.mapId,rulesetId:coopState.mode==='mania'?3:0})});
  setStatus('coopStatus','Карта сменена для всех участников.','success');
 }catch(error){setStatus('coopStatus','Не удалось сменить карту: '+error.message,'error')}
});
$('coopStart').addEventListener('click',async()=>{
 if(!coopState.room){setStatus('coopStatus','Сначала создай комнату.','error');return}
 try{
  const token=await coopAccessToken();
  await api('/api/coop/rooms/'+coopState.room.id+'/start',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  setStatus('coopStatus','Матч запущен.','success');
 }catch(error){setStatus('coopStatus','Не удалось запустить матч: '+error.message,'error')}
});
document.addEventListener('click',e=>{if(!e.target.closest('.composer')&&!e.target.closest('#attachMenu'))toggleAttach(false)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&activeRoom&&(!ws||ws.readyState!==WebSocket.OPEN))connectSocket()});
loadRooms();
</script>
