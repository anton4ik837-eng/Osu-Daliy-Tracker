name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    branches: [feature/2.3.0-replay-collector]
    paths:
      - 'app/**'
      - 'desktop/**'
      - '.github/workflows/desktop-release.yml'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build web assets
        working-directory: app
        run: |
          npm install
          npm run build
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Prepare desktop web assets
        working-directory: desktop
        run: npm run prepare:www
      - name: Build Windows installers
        working-directory: desktop
        run: npm run build:win
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Build web assets
        working-directory: app
        run: |
          npm install
          npm run build
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Prepare desktop web assets
        working-directory: desktop
        run: npm run prepare:www
      - name: Build Linux packages
        working-directory: desktop
        run: npm run build:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: dist
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: dist
      - name: Publish desktop release 4.0.0
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail
          TAG="v4.0.0"
          TITLE="osu! Daily Tracker 4.0.0"
          NOTES="$(cat <<'EOF'
          Первые десктопные сборки Replay Lab.
          - Windows: установщик (.exe) и portable-версия (.exe).
          - Linux: AppImage и .deb (x64).
          - Внутри тот же Replay Lab, что и в APK: анализ реплеев, карты, музыка, память скинов и реплеев.
          - Для загрузки библиотек LZMA/fflate/SparkMD5 нужен интернет при первом запуске.
          - Android-специфичные функции (OAuth deep link, запись лога в Downloads) на десктопе заменены на системные диалоги и внешний браузер.
          EOF
          )"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
