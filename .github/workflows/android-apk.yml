name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [app-foundation]
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: app
        run: npm install
      - name: Build native JavaScript bridge
        working-directory: app
        run: npm run build
      - name: Add Android platform
        working-directory: app
        run: npx cap add android
      - name: Register OAuth deep link
        working-directory: app
        run: npm run configure:android
      - name: Sync web assets
        working-directory: app
        run: npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug
      - name: Rename APK for 3.2.5 release
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk osu-daily-tracker-v3.2.5.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: osu-daily-tracker-v3.2.5
          path: osu-daily-tracker-v3.2.5.apk
          if-no-files-found: error
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.2.5
          name: osu! Daily Tracker 3.2.5
          prerelease: false
          make_latest: true
          body: |
            **Изменения:**
            - Добавлены цветовые пресеты в настройках.
            - Исправлена палитра Miyabi: сине-голубые оттенки.

            APK собран для Android.
          files: osu-daily-tracker-v3.2.5.apk
