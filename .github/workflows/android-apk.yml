name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [app-foundation, alpha-1.0.0-work]
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write

concurrency:
  group: android-beta-build-v1820
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: app
        run: npm install
      - name: Build native JavaScript bridge
        working-directory: app
        run: npm run build
      - name: Add Android platform
        working-directory: app
        run: npx cap add android
      - name: Verify stable signing key is configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "::error::Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "::error::Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "::error::Missing ANDROID_KEY_PASSWORD secret" && exit 1)
      - name: Register OAuth deep link, icon and signing
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run configure:android
      - name: Sync web assets
        working-directory: app
        run: npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build APK with persistent signature
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug
      - name: Name Alpha APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk osu-daily-tracker-v1.8.2.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: osu-daily-tracker-v1.8.2
          path: osu-daily-tracker-v1.8.2.apk
          if-no-files-found: error
      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8.2
          target_commitish: ${{ github.sha }}
          name: osu! Daily Tracker 1.8.2
          prerelease: true
          make_latest: false
          body: |
            **Версия 1.8.2 (тестовая beta).**

            Добавлена общая скорость воспроизведения реплея и музыки от 0,5× до 2,0×. Когда музыка включена, временная шкала синхронизируется с её playback rate; без музыки скорость реплея меняется тем же коэффициентом. Отдельная скорость прокрутки mania остаётся независимой и теперь регулируется от 0,5× до 5,0×.

            В визуализаторе исправлено отображение коротких участков траектории слайдеров: центральная линия больше не теряется под кругом старта. Отмечаются возвратные проходы слайдеров и показывается анимация спиннеров по интервалу их действия. Мисы выделяются красными крестами на шкале и дольше остаются видимыми в поле, включая mania. Координаты стандартных объектов ограничиваются видимой областью. Длительность просмотра теперь включает конец спиннера, поэтому карта не обрывается на спиннере в самом конце. Визуализация спиннера пока не симулирует полноценный игровой счёт за вращение.

            Добавлен переключатель списка результатов: последние игры или лучшие по PP. Для обоих списков поддерживается постраничная загрузка, а скачивание реплея проверяется по ID результата и владельцу аккаунта.

            Исправлено отображение промахов в osu!standard и osu!mania: красные метки MISS появляются на таймлайне и в просмотре. Нажатие на сегмент таймлайна автоматически запускает просмотр с этого места и прокручивает страницу к плееру. Нативное Android-окно выбора сложности заменено стилизованным окном Replay Lab.

            Исправлен расчёт длительности слайдеров: выбираются последние применимые timing points и inherited SV по времени, а не по порядку строк. Путь слайдера аппроксимируется по кривой и обрезается до pixelLength; индикатор движения учитывает повторения и обратный ход.

            Исправлено сохранение в Replay Lab: один и тот же реплей обновляет существующую запись, а не создаёт дубликат. При загрузке карты после сохранения без карты запись автоматически дополняется выбранной сложностью (.osu), её метаданными, исходным архивом .osz и аудио. Повторное открытие восстанавливает точную выбранную сложность и музыку; старые записи с .osz остаются совместимыми. Включены исправления траектории/длительности слайдеров и курсора standard из 1.7.11. Android versionName/versionCode: 1.8.2 / 10802.

            Поддержка скинов: импортируй .osk или ZIP через панель «Скин osu!» в Replay Lab. Текстуры hitcircle/overlay/approachcircle, slider ball/follow/start/end и spinner применяются в standard; mania использует доступные mania-note, hold-note, mania-key и stage-текстуры. Если нужного файла в скине нет, соответствующий элемент остаётся встроенным.

            Исправлена привязка значка приложения к адаптивному ресурсу @mipmap/ic_launcher; манифест теперь записывается и тогда, когда OAuth deep link уже присутствует.

            Проверить на устройстве: импорт обычного .osk и ZIP скина, STD hitcircle/slider/spinner текстуры, mania notes/holds/keys, отсутствие текстур в частичных скинах, установку/обновление APK и значок на рабочем столе. Также проверить короткие слайдеры, мисы, конец карты после спиннера, mania 5× и синхронизацию музыки.
          files: osu-daily-tracker-v1.8.2.apk
