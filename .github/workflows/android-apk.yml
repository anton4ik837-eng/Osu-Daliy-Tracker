name: Build All Platforms

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Опубликовать GitHub Release после сборки"
        required: true
        type: boolean
        default: true
  push:
    branches: [feature/2.3.0-replay-collector]
    paths:
      - 'app/**'
      - 'desktop/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.app-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read app version
        id: app-version
        working-directory: app
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building osu! Daily Tracker $VERSION"

  build-android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build web assets
        working-directory: app
        run: |
          npm install
          npm run build
      - name: Add Android platform
        working-directory: app
        run: npx cap add android
      - name: Register OAuth deep link, icon and signing
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run configure:android
      - name: Sync web assets
        working-directory: app
        run: npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build APK with persistent signature
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt"
            if ./gradlew assembleDebug --no-daemon; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          exit 1
      - name: Name APK using app version
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk "osu-daily-tracker-v${APP_VERSION}.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: osu-daily-tracker-v${{ needs.version.outputs.version }}.apk
          if-no-files-found: error

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build web assets
        working-directory: app
        run: |
          npm install
          npm run build
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Prepare desktop web assets
        working-directory: desktop
        run: npm run prepare:www
      - name: Build Windows installers
        working-directory: desktop
        run: npm run build:win
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Build web assets
        working-directory: app
        run: |
          npm install
          npm run build
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Prepare desktop web assets
        working-directory: desktop
        run: npm run prepare:www
      - name: Build Linux packages
        working-directory: desktop
        run: npm run build:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' || inputs.publish_release == true
    needs: [version, build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: dist
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: dist
      - name: Publish combined release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"
          TITLE="osu! Daily Tracker ${APP_VERSION}"
          NOTES="$(awk 'NR == 1 { next } /^# / { exit } { print }' app/CHANGELOG.md)"
          if [ -z "${NOTES//[[:space:]]/}" ]; then NOTES="osu! Daily Tracker ${APP_VERSION}"; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
