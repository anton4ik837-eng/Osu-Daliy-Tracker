name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [app-foundation]
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: app
        run: npm install
      - name: Build native JavaScript bridge
        working-directory: app
        run: npm run build
      - name: Add Android platform
        working-directory: app
        run: npx cap add android
      - name: Register OAuth deep link
        working-directory: app
        run: npm run configure:android
      - name: Sync web assets
        working-directory: app
        run: npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug
      - name: Rename APK for pre-alpha release
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk osu-daily-tracker-v1.0.0-alpha.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: osu-daily-tracker-v1.0.0-alpha
          path: osu-daily-tracker-v1.0.0-alpha.apk
          if-no-files-found: error
      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-alpha
          name: osu! Daily Tracker v1.0.0-alpha
          prerelease: true
          make_latest: false
          body: |
            **Статус: ALPHA — тестовая сборка.**

            Встроенный Replay Lab, вкладка настроек, палитра цветов, иконка приложения и проверка обновлений. Установка обновлений зависит от совместимости подписи APK. Анализатор экспериментальный; точность тайминга зависит от карты и паттернов.

            Возможны ошибки и изменения без сохранения совместимости. APK собран как debug-сборка для тестирования, не является финальным релизом.
          files: osu-daily-tracker-v1.0.0-alpha.apk
