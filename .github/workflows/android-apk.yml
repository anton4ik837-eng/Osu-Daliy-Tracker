name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Опубликовать GitHub Release после сборки"
        required: true
        type: boolean
        default: true
  push:
    branches: [app-foundation, alpha-1.0.0-work, renderer-js-releases, feature/2.3.0-replay-collector]
    paths:
      - 'app/**'
      - 'test-fixtures/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  build:
    outputs:
      version: ${{ steps.app-version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: app
        run: npm install
      - name: Read app version
        id: app-version
        working-directory: app
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building osu! Daily Tracker $VERSION"
      - name: Build native JavaScript bridge
        working-directory: app
        run: npm run build
      - name: Add Android platform
        working-directory: app
        run: npx cap add android
      - name: Register OAuth deep link, icon and signing
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run configure:android
      - name: Sync web assets
        working-directory: app
        run: npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build APK with persistent signature
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt"
            if ./gradlew assembleDebug --no-daemon; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          exit 1
      - name: Name APK using app version
        env:
          APP_VERSION: ${{ steps.app-version.outputs.version }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk "osu-daily-tracker-v${APP_VERSION}.apk"
      - name: Upload versioned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: osu-daily-tracker-v${{ steps.app-version.outputs.version }}
          path: osu-daily-tracker-v${{ steps.app-version.outputs.version }}.apk

  publish-replay-collector-beta:
    if: github.ref == 'refs/heads/feature/2.3.0-replay-collector'
    name: Publish osu! Daily Tracker ${{ needs.build.outputs.version }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout changelog
        uses: actions/checkout@v4
      - name: Download versioned APK artifact
        uses: actions/download-artifact@v4
        with:
          name: osu-daily-tracker-v${{ needs.build.outputs.version }}
          path: dist
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"
          APK="dist/osu-daily-tracker-v${APP_VERSION}.apk"
          TITLE="osu! Daily Tracker ${APP_VERSION}"
          NOTES="$(awk 'NR == 1 { next } /^# / { exit } { print }' app/CHANGELOG.md)"
          if [ -z "${NOTES//[[:space:]]/}" ]; then NOTES="osu! Daily Tracker ${APP_VERSION}"; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES"
          else
            if [[ "$APP_VERSION" == *-* ]]; then
              gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --prerelease
            else
              gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
            fi
          fi
          gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber

  publish-release:
    if: github.ref != 'refs/heads/feature/2.3.0-replay-collector' && github.ref != 'refs/heads/feature/2.2.0-replay-ai-beta'
    name: Publish osu! Daily Tracker ${{ needs.build.outputs.version }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout changelog
        uses: actions/checkout@v4
      - name: Download versioned APK artifact
        uses: actions/download-artifact@v4
        with:
          name: osu-daily-tracker-v${{ needs.build.outputs.version }}
          path: dist
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"
          APK="dist/osu-daily-tracker-v${APP_VERSION}.apk"
          TITLE="osu! Daily Tracker ${APP_VERSION}"
          NOTES="$(awk 'NR == 1 { next } /^# / { exit } { print }' app/CHANGELOG.md)"
          if [ -z "${NOTES//[[:space:]]/}" ]; then NOTES="osu! Daily Tracker ${APP_VERSION}"; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES"
          else
            if [[ "$APP_VERSION" == *-* ]]; then
              gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --prerelease
            else
              gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
            fi
          fi
          gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
