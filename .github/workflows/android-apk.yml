name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [app-foundation, alpha-1.0.0-work]
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: app
        run: npm install
      - name: Build native JavaScript bridge
        working-directory: app
        run: npm run build
      - name: Add Android platform
        working-directory: app
        run: npx cap add android
      - name: Verify stable signing key is configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "::error::Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "::error::Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "::error::Missing ANDROID_KEY_PASSWORD secret" && exit 1)
      - name: Register OAuth deep link, icon and signing
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run configure:android
      - name: Sync web assets
        working-directory: app
        run: npx cap sync android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build APK with persistent signature
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug
      - name: Name Alpha APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk osu-daily-tracker-v1.4.0-beta.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: osu-daily-tracker-v1.4.0-beta
          path: osu-daily-tracker-v1.4.0-beta.apk
          if-no-files-found: error
      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0-beta
          name: osu! Daily Tracker 1.4.0 Beta
          prerelease: true
          make_latest: false
          body: |
            **Статус: BETA — тестовая сборка.**

            Сохранение OAuth-сессии между запусками с обновлением токена; настоящий нулевой audio offset в Replay Lab; настройки и проверка обновлений. Установка обновлений зависит от совместимости подписи APK. Анализатор экспериментальный; точность тайминга зависит от карты и паттернов.

            Возможны ошибки и изменения без сохранения совместимости. APK собран как debug-сборка для тестирования, не является финальным релизом. Это бета: проверьте повторный запуск, истечение токена и звук на своём устройстве.
          files: osu-daily-tracker-v1.4.0-beta.apk
