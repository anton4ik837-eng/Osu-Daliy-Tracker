name: Deploy Cloudflare Worker
on:
  workflow_dispatch:
  push:
    branches: [alpha-1.0.0-work, feature/2.2.0-replay-ai-beta, feature/2.3.0-replay-collector]
    paths:
      - 'server/worker.js'
      - 'server/ai-gateway.js'
      - 'server/referee-hub.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Worker JavaScript syntax
        run: |
          node --input-type=module --check < server/worker.js
          node --input-type=module --check < server/ai-gateway.js
          node --input-type=module --check < server/referee-hub.js
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.toml
