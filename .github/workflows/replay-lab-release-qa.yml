name: Replay Lab Release QA

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: replay-lab-qa-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  replay-lab-full-qa:
    name: Full Replay Lab QA
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      QA_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout Replay Lab QA harness
        uses: actions/checkout@v4
        with:
          ref: alpha-1.0.0-work

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install app dependencies
        working-directory: app
        run: npm install

      - name: Replay Lab JavaScript syntax regression
        working-directory: app
        run: npm run test:replay-inline

      - name: Replay, beatmap and skin fixture regression
        run: node app/scripts/check-replay-fixtures.mjs

      - name: Download the exact APK published in this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          mkdir -p qa-results/release
          gh release download "$QA_TAG" --pattern '*.apk' --dir qa-results/release
          test "$(find qa-results/release -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          cp "$(find qa-results/release -maxdepth 1 -name '*.apk' -print -quit)" qa-results/release-apk.apk

      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build fixture-enabled QA APK
        working-directory: app
        run: |
          set -euxo pipefail
          mkdir -p www/ci-fixtures
          cp "../test-fixtures/replays/solo-replay-mania_429549_7779890059.osr" www/ci-fixtures/
          cp "../test-fixtures/replays/tupoieblan228_playing_HyuN_Encounter_FAMoss_Rendezvous_Point_2026.osr" www/ci-fixtures/
          cp "../test-fixtures/replays/176446 High Speed Music Team Sharpnel - M.A.M.A..osz" www/ci-fixtures/
          cp "../test-fixtures/skins/百鬼あやめ.osk.zip" www/ci-fixtures/
          sed -i 's|href="./replay.html"|href="./replay.html?ciReplaySkin=1"|g' www/index.html
          npm run build
          npx cap add android
          npx cap sync android
          cd android
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../../qa-results
          cp app/build/outputs/apk/debug/app-debug.apk ../../qa-results/replay-lab-qa.apk

      - name: Install Android emulator tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libpulse0 tesseract-ocr tesseract-ocr-rus
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          SDK_BIN="$(dirname "$SDKMANAGER")"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "emulator" "system-images;android-34;default;x86_64"
          adb version
          emulator -version

      - name: Boot Android emulator
        timeout-minutes: 10
        run: |
          set -euxo pipefail
          mkdir -p qa-results
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager create avd --force --name replay-lab-qa --package "system-images;android-34;default;x86_64" --device pixel_2 --path "$ANDROID_AVD_HOME/replay-lab-qa.avd" <<< "no"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo "::error::KVM unavailable"; exit 1; fi
          nohup emulator -avd replay-lab-qa -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save -wipe-data > qa-results/emulator.log 2>&1 &
          for i in $(seq 1 90); do
            adb devices | grep -qE '^emulator-[0-9]+[[:space:]]+device$' && break
            sleep 2
          done
          adb wait-for-device
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Run Replay Lab integration and regression tests
        id: replay-test
        run: |
          set -euxo pipefail
          # First verify the actual APK attached to the published GitHub Release.
          adb install -r qa-results/release-apk.apk
          adb shell monkey -p com.osudailytracker.app 1
          sleep 12
          adb shell pidof com.osudailytracker.app
          adb exec-out screencap -p > qa-results/release-apk-home.png
          adb uninstall com.osudailytracker.app
          # Then install the fixture-enabled build of the same tagged source.
          adb install -r qa-results/replay-lab-qa.apk
          adb logcat -c
          adb shell monkey -p com.osudailytracker.app 1
          sleep 12
          adb exec-out screencap -p > qa-results/home-screen.png
          adb shell input tap 735 70
          sleep 3
          adb exec-out screencap -p > qa-results/replay-lab-screen.png
          adb shell input tap 545 1565
          result=waiting
          deadline=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! adb shell pidof com.osudailytracker.app >/dev/null 2>&1; then result=process_exit; break; fi
            adb exec-out screencap -p > qa-results/replay-lab-current.png
            tesseract qa-results/replay-lab-current.png stdout -l rus+eng 2>/dev/null > qa-results/replay-lab-ocr.txt || true
            if grep -Eqi 'CI TEST PASS' qa-results/replay-lab-ocr.txt; then result=pass; break; fi
            if grep -Eqi 'CI TEST FAIL' qa-results/replay-lab-ocr.txt; then result=fail; break; fi
            sleep 3
          done
          adb exec-out screencap -p > qa-results/replay-lab-final.png
          tesseract qa-results/replay-lab-final.png stdout -l rus+eng 2>/dev/null > qa-results/replay-lab-final-ocr.txt || true
          adb logcat -d -v threadtime > qa-results/logcat.txt
          printf '{"tag":"%s","result":"%s","finishedAt":"%s"}\n' "$QA_TAG" "$result" "$(date -u +%FT%TZ)" > qa-results/qa-summary.json
          if [ "$result" != pass ]; then
            echo "::error::Replay Lab emulator integration failed: $result"
            cat qa-results/replay-lab-final-ocr.txt
            exit 1
          fi
          if grep -E 'FATAL EXCEPTION|Fatal signal [0-9]+ \\(SIG' qa-results/logcat.txt; then
            echo "::error::Android fatal crash detected"
            exit 1
          fi

      - name: Collect failure diagnostics and screenshots
        if: failure()
        run: |
          mkdir -p qa-results
          adb devices -l > qa-results/adb-devices.txt 2>&1 || true
          adb logcat -d -v threadtime > qa-results/logcat-failure.txt 2>&1 || true
          adb exec-out screencap -p > qa-results/failure-screen.png 2>/dev/null || true
          tail -n 500 qa-results/emulator.log > qa-results/emulator-tail.log 2>&1 || true
          printf '{"tag":"%s","result":"failure","capturedAt":"%s"}\n' "$QA_TAG" "$(date -u +%FT%TZ)" > qa-results/qa-summary.json

      - name: Upload QA report, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-lab-qa-${{ env.QA_TAG }}
          path: qa-results/
          if-no-files-found: warn
          retention-days: 30
